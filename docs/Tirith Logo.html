  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

        e.target.tagName, String(e.target.src || e.target.href || ''));

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;

      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }

      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.

        pendingRelays[uuid] = [e.source];

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

      const entry = manifest[uuid];

              const { done, value } = await reader.read();

          }

        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

and every gate set on the far side of the one below it, so anyone who broke the first was walking sideways by the time he met the second. Tirith does that to a deployment. Three drawings of the idea below, each shown large, reversed and reduced, so the choice rests on evidence rather than taste.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:18px\"><div style=\"flex:1 1 320px;min-width:300px;background:#fff;border:1px solid #E3E3E0;border-radius:16px;overflow:hidden;display:flex;flex-direction:column\">\n      <div style=\"padding:20px 22px 0;display:flex;align-items:center;gap:9px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:4px;background:#111318;color:#fff\">A<\u002Fspan><span style=\"font-size:15.5px;font-weight:600;letter-spacing:-.02em\">Primary<\u002Fspan><span style=\"font-size:12.5px;color:#6E6E69;margin-left:auto\">The gate left open<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:34px 30px;height:236px;display:grid;place-items:center\"><svg width=\"168\" height=\"168\" sc-camel-view-box=\"0 -2 48 48\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block\"><path d=\"M45.5843 15.4244C46.2117 15.191 46.9121 15.5154 47.1014 16.1575C48.5957 21.2275 48.2205 26.699 46.0198 31.5237C43.6505 36.7178 39.3598 40.7365 34.0919 42.6966C28.8239 44.6568 23.0098 44.3977 17.929 41.9756C13.1999 39.7211 9.4669 35.7646 7.42668 30.8849C7.17361 30.2796 7.49381 29.5977 8.10865 29.3689L16.349 26.3016C17.0432 26.0432 17.798 26.4741 18.043 27.1732C19.3373 30.8675 22.6681 32.9806 26.4749 34.3245C26.728 34.4209 27.0058 34.4249 27.2616 34.3363C32.1468 32.5955 36.2571 29.5939 36.2571 23.5913V20.5625C36.2571 19.5598 36.8804 18.6628 37.8202 18.3131L45.5843 15.4244Z\" fill=\"#111318\"><\u002Fpath><path d=\"M13.9085 1.2578C19.1762 -0.634534 24.9895 -0.383285 30.0701 1.95508C34.78 4.12296 38.5026 7.92063 40.5484 12.6058C40.8151 13.2168 40.4886 13.9122 39.8611 14.1375L32.1379 16.9119C31  24.1599 16.0416 24.4784 16.1213L31.5148 17.8804C31.8291 17.9589 32.1578 17.96 32.4725 17.8834L35.6314 17.1151C36.8993 16.8067 37.5363 15.3801 36.7478 14.3404C33.8266 10.4881 29.2009 8 23.9933 8C15.6843 8 8.85507 14.3337 8.06934 22.4366C7.99033 23.2515 7.4938 23.9835 6.72947 24.2769L2.56229 25.8764C1.34306 26.3443 0.00738754 25.5343 0.000339237 24.2283C-0.0696101 11.2678 10.6868 0 23.9933 0Z\" fill=\"#111318\"><\u002Fpath><\u002Fsvg><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#6E6E69\">32<\u002Fspan><\u002Fspan><span style=\"margin-left:auto;display:grid;place-items:center;width:38px;height:38px;border-radius:9px;background:#111318\"><svg width=\"26\" height=\"26.0\" sc-camel-view-box=\"0 0 48 48\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block\"><path d=\"M23.9933 0C34.2953 0 43.0804 6.49108 46.4836 15.6063C46.8488 16.5842 46.3084 17.6445 45.3307 18.0103L33.2925 22.5139C32.5111 22.8063 31.9933 23.5529 31.9933 24.3871V29.8915C31.9933 30.5811 31.638 31.222 31.0533 31.5875L25.0533 35.3375C24.4048 35.7428 23.5819 35.7428 22.9333 35.3375L16.5746 31.3633C16.1978 31.1278 15.7534 31.0245 15.3114 31.0697L12.9084 31.3151C11.4881 31.4602 10.6895 33.0034 11.5921 34.1095C14.5259 37.7045 18.9913 40 23.9933 40C32.2548 40 39.0531 33.7385 39.903 25.7024C39.9884 24.895 40.4836 24.1723 41.2415 23.8814L45.4248 22.2759C46.6487 21.8061 47.988 22.6242 47.9862 23.9352C47.9686 36.8386 37.2375 48 23.9933 48C13.7398 48 4.98917 41.5697 1.55167 32.522C1.18169 31.5482 1.71288 30.4867 2.68528 30.1131L14.7106 25.4928C15.4833 25.1959 15.9933 24.4537 15.9933 23.6259V19.5616C15.9933 18.6438 16.6179 17.8439 17.5082 17.6213L23.5083 16.1213C23.8267 16.0416 24.1599 16.0416 24.4784 16.1213L31.5148 17.8804C31.8291 17.9589 32.1578 17.96 32.4725 17.8834L35.6314 17.1151C36.8993 16.8067 37.5363 15.3801 36.7478 14.3404C33.8266 10.4881 29.2009 8 23.9933 8C15.6843 8 8.85507 14.3337 8.06934 22.4366C7.99033 23.2515 7.4938 23.9835 6.72947 24.2769L2.56229 25.8764C1.34306 26.3443 0.00738754 25.5343 0.000339237 24.2283C-0.0696101 11.2678 10.6868 0 23.9933 0Z\" fill=\"#FAFAF9\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:18px\">\n    <div style=\"max-width:74ch;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.11em;color:#6E6E69\">WHERE THE SHAPE COMES FROM<\u002Fdiv>\n      <h2 style=\"margin:0;font-size:27px;font-weight:700;letter-spacing:-.028em;line-height:1.15\">A city in plan, opened up<\u002Fh2>\n      <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:#4A4A46;text-wrap:pretty\">The city is the argument, not the decoration. No castle and no tower appear in the mark. What carries over is the plan, in four moves.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:15px\"><div style=\"flex:1 1 235px;min-width:225px;background:#fff;border:1px solid #E3E3E0;border-radius:14px;overflow:hidden;display:flex;flex-direction:column\">\n        <div style=\"padding:20px;display:grid;place-items:center;background:#FCFCFB;border-bottom:1px solid #EDEDEA\"><svg width=\"118\" height=\"118\" sc-camel-view-box=\"0 0 48 48\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block\"><path d=\"M40.99 36.34A21 21 0 0 1 3.62 18.92\" fill=\"none\" stroke=\"#111318\" stroke-width=\"1.7\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M7.01 11.66A21 21 0 0 1 44.38 29.08\" fill=\"none\" stroke=\"#111318\" stroke-width=\"1.7\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M14.36 37.27A16.4 16.4 0 0 1 27.97 8.09\" fill=\"none\" stroke=\"#111318\" stroke-width=\"1.7\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M33.64 10.73A16.4 16.4 0 0 1 20.03 39.91\" fill=\"none\" stroke=\"#111318\" stroke-width=\"1.7\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M33.22 30.70A11.4 11.4 0 0 1 12.94 21.24\" fill=\"none\" stroke=\"#111318\" stroke-width=\"1.7\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M14.78 17.30A11.4 11.4 0 0 1 35.06 26.76\" fill=\"none\" stroke=\"#111318\" stroke-width=\"1.7\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M20.24 29.18A6.4 6.4 0 0 1 25.55 17.79\" fill=\"none\" stroke=\"#111318\" stroke-width=\"1.7\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M27.76 18.82A6.4 6.4 0 0 1 22.45 30.21\" fill=\"none\" stroke=\"#111318\" stroke-width=\"1.7\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div style=\"padding:15px 17px;display:flex;flex-direction:column;gap:6px\">\n          <div style=\"display:flex;align-items:center;gap:7px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;padding:1px 5px;border-radius:3px;background:#EDEDEB;color:#111318\">01<\u002Fspan><span style=\"font-size:13.5px;font-weight:600;letter-spacing:-.015em\">Seven walls<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0;font-size:11.5px;line-height:1.5;color:#4A4A46;text-wrap:pretty\">Seven walls climbing a spur of rock, one gate in each, and no gate on the same side as the one below it. Anyone climbing spent the whole ascent turning. Seen from above, that is a set of broken rings.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv><div style=\"flex:1 1 235px;min-width:225px;background:#fff;border:1px solid #E3E3E0;border-radius:14px;overflow:hidden;display:flex;flex-direction:column\">\n        <div style=\"padding:20px;display:grid;place-items:center;background:#FCFCFB;border-bottom:1px solid #EDEDEA\"><svg width=\"118\" height=\"118\" sc-camel-view-box=\"0 0 48 48\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block\"><path d=\"M40.31 31.61A18 18 0 0 1 7.69 31.61\" fill=\"none\" stroke=\"#111318\" stroke-width=\"5.2\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M7.69 16.39A18 18 0 0 1 40.31 16.39\" fill=\"none\" stroke=\"#111318\" stroke-width=\"5.2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div style=\"padding:15px 17px;display:flex;flex-direction:column;gap:6px\">\n          <div style=\"display:flex;align-items:center;gap:7px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;padding:1px 5px;border-radius:3px;background:#EDEDEB;color:#111318\">02<\u002Fspan><span style=\"font-size:13.5px;font-weight:600;letter-spacing:-.015em\">Down to two<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0;font-size:11.5px;line-height:1.5;color:#4A4A46;text-wrap:pretty\">Seven walls is a drawing. Two is a mark. One band, broken twice, gates set opposite, which is the fewest breaks that still make a sequence rather than a hole.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv><div style=\"flex:1 1 235px;min-width:225px;background:#fff;border:1px solid #E3E3E0;border-radius:14px;overflow:hidden;display:flex;flex-direction:column\">\n        <div style=\"padding:20px;display:grid;place-items:center;background:#FCFCFB;border-bottom:1px solid #EDEDEA\"><svg width=\"118\" height=\"118\" sc-camel-view-box=\"0 0 48 48\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block\"><path d=\"M41.76 32.28A19.6 19.6 0 0 1 24.00 43.60L24.00 39.40A15.4 15.4 0 0 1 10.04 30.51\" fill=\"none\" stroke=\"#111318\" stroke-width=\"5.2\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M6.24 15.72A19.6 19.6 0 0 1 24.00 4.40L24.00 8.60A15.4 15.4 0 0 1 37.96 17.49\" fill=\"none\" stroke=\"#111318\" stroke-width=\"5.2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div style=\"padding:15px 17px;display:flex;flex-direction:column;gap:6px\">\n          <div style=\"display:flex;align-items:center;gap:7px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;padding:1px 5px;border-radius:3px;background:#EDEDEB;color:#111318\">03<\u002Fspan><span style=\"font-size:13.5px;font-weight:600;letter-spacing:-.015em\">The climb<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0;font-size:11.5px;line-height:1.5;color:#4A4A46;text-wrap:pretty\">The inner edge steps in behind each gate, so the band is never a constant ring. That is the climb in plan, and it is also what keeps the shape from settling into a target.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv><div style=\"flex:1 1 235px;min-width:225px;background:#fff;border:1px solid #E3E3E0;border-radius:14px;overflow:hidden;display:flex;flex-direction:column\">\n        <div style=\"padding:20px;display:grid;place-items:center;background:#FCFCFB;border-bottom:1px solid #EDEDEA\"><svg width=\"118\" height=\"118\" sc-camel-view-box=\"0 -2 48 48\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block\"><path d=\"M45.5843 15.4244C46.2117 15.191 46.9121 15.5154 47.1014 16.1575C48.5957 21.2275 48.2205 26.699 46.0198 31.5237C43.6505 36.7178 39.3598 40.7365 34.0919 42.6966C28.8239 44.6568 23.0098 44.3977 17.929 41.9756C13.1999 39.7211 9.4669 35.7646 7.42668 30.8849C7.17361 30.2796 7.49381 29.5977 8.10865 29.3689L16.349 26.3016C17.0432 26.0432 17.798 26.4741 18.043 27.1732C19.3373 30.8675 22.6681 32.9806 26.4749 34.3245C26.728 34.4209 27.0058 34.4249 27.2616 34.3363C32.1468 32.5955 36.2571 29.5939 36.2571 23.5913V20.5625C36.2571 19.5598 36.8804 18.6628 37.8202 18.3131L45.5843 15.4244Z\" fill=\"#111318\"><\u002Fpath><path d=\"M13.9085 1.2578C19.1762 -0.634534 24.9895 -0.383285 30.0701 1.95508C34.78 4.12296 38.5026 7.92063 40.5484 12.6058C40.8151 13.2168 40.4886 13.9122 39.8611 14.1375L32.1379 16.9119C31.356 17.1928 30.5322 16.6134 30.5322 15.7826V13.9095C30.5317 11.5063 22.9606 9.27347 21.1378 9.2731C19.4301 9.2731 11.7438 11.6918 11.7434 13.9095V22.0233C11.7434 22.4077 11.7619 22.7793 11.7975 23.1386C11.8563 23.7313 11.5354 24.3131 10.9749 24.5145L2.39439 27.5976C1.77435 27.8204 1.08701 27.5023 0.895001 26.8721C-0.595461 21.9798 -0.21823 16.7013 1.98085 12.0464C4.35007 7.03141 8.64065 3.15034 13.9085 1.2578Z\" fill=\"#111318\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div style=\"padding:15px 17px;display:flex;flex-direction:column;gap:6px\">\n          <div style=\"display:flex;align-items:center;gap:7px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;padding:1px 5px;border-radius:3px;background:#EDEDEB;color:#111318\">04<\u002Fspan><span style=\"font-size:13.5px;font-weight:600;letter-spacing:-.015em\">Leave it open<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0;font-size:11.5px;line-height:1.5;color:#4A4A46;text-wrap:pretty\">No disc, no floor. The walls carry the ink and the bottom-left stays open, so what is drawn is a passage rather than a container.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#111318;color:#FAFAF9;border-radius:16px;padding:26px 28px;display:flex;flex-wrap:wrap;gap:26px;align-items:center\">\n      <div style=\"flex:0 0 auto\"><svg width=\"128\" height=\"128\" sc-camel-view-box=\"0 -2 48 48\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block\"><path d=\"M45.5843 15.4244C46.2117 15.191 46.9121 15.5154 47.1014 16.1575C48.5957 21.2275 48.2205 26.699 46.0198 31.5237C43.6505 36.7178 39.3598 40.7365 34.0919 42.6966C28.8239 44.6568 23.0098 44.3977 17.929 41.9756C13.1999 39.7211 9.4669 35.7646 7.42668 30.8849C7.17361 30.2796 7.49381 29.5977 8.10865 29.3689L16.349 26.3016C17.0432 26.0432 17.798 26.4741 18.043 27.1732C19.3373 30.8675 22.6681 32.9806 26.4749 34.3245C26.728 34.4209 27.0058 34.4249 27.2616 34.3363C32.1468 32.5955 36.2571 29.5939 36.2571 23.5913V20.5625C36.2571 19.5598 36.8804 18.6628 37.8202 18.3131L45.5843 15.4244Z\" fill=\"#FAFAF9\"><\u002Fpath><path d=\"M13.9085 1.2578C19.1762 -0.634534 24.9895 -0.383285 30.0701 1.95508C34.78 4.12296 38.5026 7.92063 40.5484 12.6058C40.8151 13.2168 40.4886 13.9122 39.8611 14.1375L32.1379 16.9119C31.356 17.1928 30.5322 16.6134 30.5322 15.7826V13.9095C30.5317 11.5063 22.9606 9.27347 21.1378 9.2731C19.4301 9.2731 11.7438 11.6918 11.7434 13.9095V22.0233C11.7434 22.4077 11.7619 22.7793 11.7975 23.1386C11.8563 23.7313 11.5354 24.3131 10.9749 24.5145L2.39439 27.5976C1.77435 27.8204 1.08701 27.5023 0.895001 26.8721C-0.595461 21.9798 -0.21823 16.7013 1.98085 12.0464C4.35007 7.03141 8.64065 3.15034 13.9085 1.2578Z\" fill=\"#FAFAF9\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div style=\"flex:1 1 420px;min-width:380px;display:flex;flex-direction:column;gap:12px\">\n        <p style=\"margin:0;font-size:17px;line-height:1.45;color:#fff;font-weight:500;letter-spacing:-.015em;text-wrap:pretty\">Opposed gates are the product.<\u002Fp>\n        <p style=\"margin:0;font-size:14px;line-height:1.6;color:#D2D2CE;text-wrap:pretty\">A change arrives at the first wall, gets checked, and comes out facing the wrong way for the second. It cannot run the walls in a straight line and it cannot skip one. That is a policy engine described as a floor plan: every deploy walks the same route, every wall gets its say, and nothing reaches the summit unexamined.<\u002Fp>\n        <p style=\"margin:0;font-size:14px;line-height:1.6;color:#D2D2CE;text-wrap:pretty\">StackGuardian watches what reaches production. Tirith is the part that decides whether it should, so the mark inherits the family’s geometry and none of the parent’s shapes. The form also has no up: rotational rather than mirror symmetry, which is why it holds at any angle and reads the same in an avatar as in a favicon.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#111318;color:#FAFAF9;border-radius:16px;padding:26px 28px;display:flex;flex-wrap:wrap;gap:28px;align-items:center\">\n    <div style=\"flex:0 0 auto;display:flex;gap:16px;align-items:center\"><svg width=\"86\" height=\"86\" sc-camel-view-box=\"0 -2 48 48\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block\"><path d=\"M45.5843 15.4244C46.2117 15.191 46.9121 15.5154 47.1014 16.1575C48.5957 21.2275 48.2205 26.699 46.0198 31.5237C43.6505 36.7178 39.3598 40.7365 34.0919 42.6966C28.8239 44.6568 23.0098 44.3977 17.929 41.9756C13.1999 39.7211 9.4669 35.7646 7.42668 30.8849C7.17361 30.279 y\">Same language throughout: broken ring, opposed gates, stepped inner edge. They are not interchangeable, because each answers a different part of the brief. Primary is the most open and the most legible. Keep is the most durable. Ward carries the most story. Pick one and the other two stop existing.<\u002Fp>\n      <p style=\"margin:0;font-size:14px;line-height:1.6;color:#D2D2CE;text-wrap:pretty\">Where I would land: <strong style=\"color:#fff\">Ward<\u002Fstrong>. It is the only one whose shape says what the name means, a route that travels around the ward before it gets in, and the only one that still means something with the wordmark covered. Primary reads as a refresh glyph at a glance. Keep, for all its durability, stops traffic rather than routing it.<\u002Fp>\n      <p style=\"margin:0;font-size:14px;line-height:1.6;color:#D2D2CE;text-wrap:pretty\">Whichever wins needs a redrawn small cut, since Ward’s corridor and Primary’s tapered tip both close below 24&nbsp;px, and Primary needs squaring onto a 48 box.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<div style=\"background:#fff;border:1px solid #E3E3E0;border-radius:16px;overflow:hidden\">\n    <div style=\"padding:20px 24px 16px;border-bottom:1px solid #EDEDEA\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#6E6E69\">LOCKUPS · REAL WORDMARK OUTLINES<\u002Fspan><\u002Fdiv>\n    <div style=\"padding:26px 28px;display:flex;align-items:center;gap:20px;background:#fff;border-bottom:1px solid #EDEDEA\"><svg width=\"300\" height=\"96\" sc-camel-view-box=\"0 0 112 36\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block\"><g transform=\"translate(0 4.25) scale(0.625)\"><path d=\"M45.5843 15.4244C46.2117 15.191 46.9121 15.5154 47.1014 16.1575C48.5957 21.2275 48.2205 26.699 46.0198 31.5237C43.6505 36.7178 39.3598 40.7365 34.0919 42.6966C28.8239 44.6568 23.0098 44.3977 17.929 41.9756C13.1999 39.7211 9.4669 35.7646 7.42668 30.8849C7.17361 30.2796 7.49381 29.5977 8.10865 29.3689L16.34
